name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/test_static.py

  build:
    name: Build
    needs: linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t mini-app:${{ github.sha }} .

      - run: docker save mini-app:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: application-image
          path: image.tar

  staging:
    name: Deploy STG
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-image

      - run: docker load -i image.tar

      - run: echo "Deploying ${{ github.sha }} to STG"

  staging-tests:
    name: Test STG
    needs: staging
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "STG tests"
          echo "GET / -> 200"
          echo "HTML -> OK"

  production:
    name: Deploy PROD
    needs: staging-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-image

      - run: docker load -i image.tar

      - run: echo "Deploying ${{ github.sha }} to PROD"

  production-tests:
    name: Test PROD
    needs: production
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "PROD tests"
          echo "GET / -> 200"
          echo "HTML -> OK"