name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/test_static.py

  build:
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mini-app:${{ github.sha }} .
      - run: docker save mini-app:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

  staging:
    needs: build
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - run: echo "STG deploy: mini-app:${{ github.sha }}"

  staging_tests:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "STG smoke tests"
          echo "GET / -> 200"
          echo "HTML -> OK"

  production:
    needs: staging_tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - run: echo "PROD deploy: mini-app:${{ github.sha }}"

  production_tests:
    needs: production
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "PROD smoke tests"
          echo "GET / -> 200"
          echo "HTML -> OK"
